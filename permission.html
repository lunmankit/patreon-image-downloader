<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>允許網站權限</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    h3 { margin: 0 0 8px; font-size: 15px; }
    p { font-size: 13px; line-height: 1.45; margin: 0 0 12px; }
    button {
      width: 100%;
      padding: 10px;
      background: #ff424d;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { font-size: 12px; color: #666; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>允許讀取此網站</h3>
  <p id="explain">第一次掃瞄這個網站時，需要你允許擴充功能讀取該網址，才能找出縮圖對應的原圖。安裝時不會取得所有網站的權限。</p>
  <button id="allow" type="button">允許並掃瞄</button>
  <p id="status"></p>
  <script src="gallery-scan.js"></script>
  <script src="permission.js"></script>
</body>
</html>
