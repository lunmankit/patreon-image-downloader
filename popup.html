<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #ff424d;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .filter-box {
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .filter-box label {
      font-size: 12px;
      font-weight: bold;
      color: #444;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .filter-box input[type="range"] {
      width: 100%;
      margin: 0;
    }
    .option-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      color: #444;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #eee;
    }
    .option-row input[type="checkbox"] {
      margin-right: 6px;
    }
    .hint {
      font-size: 11px;
      color: #777;
      margin: -4px 0 8px;
      line-height: 1.4;
    }
    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    #preview-container {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      padding: 6px;
      display: none;
    }
    .preview-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .preview-item img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      margin-right: 8px;
      border-radius: 4px;
    }
    .preview-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-filename {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: bold;
      color: #333;
    }
    .preview-size {
      color: #888;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <h3>Patreon / Fantia 圖片批次下載器</h3>
  <p class="hint">Fantia 付費內容只會下載已登入且看得到的圖片，不會嘗試解鎖未購買的內容。</p>

  <button id="scan-btn">掃瞄頁面圖片</button>

  <div class="filter-box">
    <label for="size-filter">
      <span>最小尺寸限制 (寬或高)</span>
      <span id="size-val">400 px</span>
    </label>
    <input type="range" id="size-filter" min="0" max="2000" step="100" value="400">

    <div class="option-row">
      <input type="checkbox" id="auto-load-cb" checked>
      <label for="auto-load-cb" style="font-weight:normal; margin:0;">自動滾動或翻頁並載入所有貼文</label>
    </div>
  </div>

  <div id="status">準備就緒</div>
  <button id="download-btn" style="display:none;">下載符合條件圖片 (<span id="count">0</span>)</button>
  <div id="preview-container"></div>

  <script src="popup.js"></script>
</body>
</html>
